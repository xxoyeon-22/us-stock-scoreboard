universe:
  name: S&P 500
  # 열: Symbol, Security, GICS Sector, ...
  url: https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv
  cache: config/sp500.csv     # 내려받기에 실패하면 마지막으로 받은 사본을 쓴다

finnhub:
  base_url: https://finnhub.io/api/v1
  # 무료 플랜은 분당 60회. 브라우저의 실시간 시세 호출과 같은 키를 나눠 쓰므로 여유를 둔다.
  requests_per_minute: 45

output_dir: web/data

llm:
  # 뉴스 쉬운 설명·호재 판단·전망에 쓰는 Claude 모델. 비용을 줄이려면 claude-sonnet-5-5 나 claude-haiku-5-5 로 바꾼다.
  model: claude-sonnet-5-5        # 종목 분석·투자자 요약 (가장 싼 선택: claude-haiku-5-5)
  headline_model: claude-haiku-5-5   # 헤드라인 한 줄 풀이는 단순 작업이라 가장 싼 모델
  fallbacks: true
  effort: {headlines: low, stock: medium, investor: medium}
  headline_batch: 40            # 한 번의 호출에 넣는 헤드라인 수
  max_headlines_per_run: 160    # 한 번 실행에서 새로 풀이할 헤드라인 상한
  max_stocks_per_day: 20        # 하루에 새로 분석할 종목 수 상한 — 비용 상한 역할
  min_hours_between: 12         # 같은 종목을 다시 분석하기까지 최소 간격
  max_stocks_per_run: 10        # 한 번 실행에서 새로 분석할 종목 상한
  stock_news_days: 7            # 종목 분석에 쓰는 뉴스 기간
  stock_news_max: 12
  sentiment_valid_days: 30      # 이보다 오래된 분석은 뉴스 감성 점수에 쓰지 않는다
