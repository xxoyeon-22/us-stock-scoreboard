# 유명 투자자 목록. SEC 13F 는 cik 로 조회한다.
# weight: 13F 신호의 신뢰도 (멀티 전략 펀드는 종목 수가 많아 낮춘다).
# keywords: 관련 뉴스·발언 헤드라인을 찾을 때 쓰는 검색어.

top_holdings: 30          # 화면에 보여줄 보유 종목 수
map_top: 60               # CUSIP → 티커 매핑을 시도할 상위 종목 수
change_threshold: 0.05    # 주식 수가 이 비율 이상 변해야 확대/축소로 본다
news_per_investor: 12
news_search:              # 투자자 이름으로 헤드라인 검색 (제목·링크만 저장)
  enabled: true
  url: "https://news.google.com/rss/search?q={query}+when:14d&hl=en-US&gl=US&ceid=US:en"

action_scores: {new: 100, add: 80, hold: 60, trim: 35, exit: 10}
consensus_bonus: 5        # 같은 분기에 매수(신규·확대)한 투자자가 한 명 늘 때마다

