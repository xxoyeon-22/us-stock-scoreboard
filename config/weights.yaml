# 종합 점수 가중치 — 출발점으로 잡은 임의값이다. 백테스트·전진 검증 결과를 보고 조정한다.
# 데이터가 없는 구성 요소는 0점이 아니라 제외 후 가중치를 재분배한다 (합이 1이 아니어도 비율로 계산).
# source: metric = Finnhub 지표(keys 가 필드 이름 후보), extra = 별도 수집(jobs.py), earnings/diff/range = 계산값

min_group_size: 5        # 섹터 내 유효 종목이 이보다 적으면 전체 유니버스 백분위로 대체

regime:                  # 시장 국면 보정 계수 (0.8~1.1). current 는 market.json 이 있으면 그 값으로 자동 덮어쓴다
  min: 0.8
  max: 1.1
  current: 1.0

risk:                    # 점수에는 넣지 않고 화면에 위험 표시로만 쓴다
  beta_high: 1.3
  beta_low: 0.8
  mdd_high: -40          # 최근 1년 최대 낙폭이 이보다 깊으면 변동성 높음
  mdd_low: -20
  min_dollar_volume: 20000000     # 하루 평균 거래대금(달러)이 이보다 적으면 유동성 경고
  concentration_top: 20           # 상위 N 종목의 섹터 편중을 본다
  concentration_warn: 0.4         # 한 섹터가 이 비율 이상이면 경고

info:                    # 점수 외에 화면에 보여줄 값
  beta: [beta]
  high_52w: [52WeekHigh]
  low_52w: [52WeekLow]
  avg_volume_10d_m: [10DayAverageTradingVolume]      # 단위: 백만 주
  market_cap_m: [marketCapitalization]               # 단위: 백만 달러
  return_52w: [52WeekPriceReturnDaily]

components:
  fundamental:
    label: 성장·수익성
    weight: 0.20
    metrics:
      revenue_growth: {label: "매출 성장률 (YoY)", unit: "%", higher_better: true, source: metric, keys: [revenueGrowthTTMYoy, revenueGrowthQuarterlyYoy]}
      eps_growth: {label: "EPS 성장률 (YoY)", unit: "%", higher_better: true, source: metric, keys: [epsGrowthTTMYoy, epsGrowthQuarterlyYoy]}
      operating_margin: {label: 영업이익률, unit: "%", higher_better: true, source: metric, keys: [operatingMarginTTM, operatingMarginAnnual]}
      margin_trend: {label: "마진 추세 (현재 − 5년 평균)", unit: "%p", higher_better: true, source: diff, keys: [operatingMarginTTM, operatingMarginAnnual], keys_b: [operatingMargin5Y]}
      roe: {label: ROE, unit: "%", higher_better: true, source: metric, keys: [roeTTM, roeRfy]}
      roic: {label: "ROIC (투하자본수익률)", unit: "%", higher_better: true, source: metric, keys: [roiTTM, roiAnnual]}
      earnings_surprise: {label: "어닝 서프라이즈 (최근 4분기 평균)", unit: "%", higher_better: true, source: earnings}

  health:
    label: 재무 건전성
    weight: 0.10
    metrics:
      debt_to_equity: {label: "부채비율 (총부채/자본)", unit: "x", higher_better: false, source: metric, keys: [totalDebt/totalEquityQuarterly, totalDebt/totalEquityAnnual]}
      interest_coverage: {label: 이자보상배율, unit: "x", higher_better: true, source: metric, keys: [netInterestCoverageTTM, netInterestCoverageAnnual]}
      ev_fcf: {label: "EV/FCF (잉여현금흐름 대비 가격)", unit: "x", higher_better: false, positive_only: true, source: metric, keys: [currentEv/freeCashFlowTTM, currentEv/freeCashFlowAnnual]}
      current_ratio: {label: 유동비율, unit: "x", higher_better: true, source: metric, keys: [currentRatioQuarterly, currentRatioAnnual]}

  valuation:
    label: 밸류에이션
    weight: 0.13
    metrics:
      pe: {label: "PER (TTM)", unit: "x", higher_better: false, positive_only: true, source: metric, keys: [peTTM, peBasicExclExtraTTM, peExclExtraTTM]}
      forward_pe: {label: Forward PER, unit: "x", higher_better: false, positive_only: true, source: metric, keys: [forwardPE]}
      ps: {label: "PSR (TTM)", unit: "x", higher_better: false, positive_only: true, source: metric, keys: [psTTM, psAnnual]}
      ev_ebitda: {label: EV/EBITDA, unit: "x", higher_better: false, positive_only: true, source: metric, keys: [evEbitdaTTM]}

  momentum:
    label: 모멘텀·추세
    weight: 0.10
    metrics:
      return_13w: {label: "13주 수익률", unit: "%", higher_better: true, source: metric, keys: [13WeekPriceReturnDaily]}
      return_26w: {label: "26주 수익률", unit: "%", higher_better: true, source: metric, keys: [26WeekPriceReturnDaily]}
      rel_strength: {label: "S&P 500 대비 상대 강도 (52주)", unit: "%p", higher_better: true, source: metric, keys: ["priceRelativeToS&P50052Week"]}
      range_52w: {label: "52주 범위 내 위치 (0=저점, 100=고점)", unit: "", higher_better: true, source: range, keys: [52WeekLow], keys_b: [52WeekHigh]}
      ma200_gap: {label: "200일 이동평균 대비 현재가", unit: "%", higher_better: true, source: extra}
      ma_cross: {label: "50일선 − 200일선 (골든크로스 +)", unit: "%", higher_better: true, source: extra}

  investors:
    label: 투자자 포지션
    weight: 0.12
  news:
    label: 뉴스 감성
    weight: 0.10

  flow:
    label: 수급·주주 환원
    weight: 0.10
    metrics:
      insider_mspr: {label: "내부자 순매수 심리 (최근 6개월 MSPR)", unit: "", higher_better: true, source: extra}
      buyback_yield: {label: "자사주 매입 / 시가총액", unit: "%", higher_better: true, source: extra}
      share_change: {label: "주식 수 증가율 (희석, YoY)", unit: "%", higher_better: false, source: extra}
      sbc_yield: {label: "주식 보상 비용 / 시가총액", unit: "%", higher_better: false, source: extra}

  analyst:
    label: 애널리스트 의견
    weight: 0.05
    metrics:
      rec_level: {label: "추천 의견 수준 (매수 우세 +)", unit: "", higher_better: true, source: extra}
      rec_change: {label: "추천 의견 3개월 변화", unit: "", higher_better: true, source: extra}

  moat:                  # 10-K 사업 설명을 Claude 가 읽고 매긴 0~100 점 (config/moat.json)
    label: 경쟁 우위(해자)
    weight: 0.10
