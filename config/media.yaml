# 언론사 RSS 목록. 헤드라인 + 요약 + 원문 링크만 저장한다 (유료 본문은 수집하지 않는다).
# 주소가 바뀌거나 막히면 enabled: false 로 끄거나 url 만 교체한다. 실패한 피드는 건너뛴다.

retention_days: 7
max_items: 400
summary_max_chars: 280

feeds:
  - id: wsj
    name: Wall Street Journal
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    enabled: true
  - id: bloomberg
    name: Bloomberg
    url: https://feeds.bloomberg.com/markets/news.rss
    enabled: true
  - id: cnbc
    name: CNBC
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    enabled: true
  - id: ft
    name: Financial Times
    url: https://www.ft.com/markets?format=rss
    enabled: true
  - id: marketwatch
    name: MarketWatch
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    enabled: true
  - id: yahoo
    name: Yahoo Finance
    url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5EGSPC&region=US&lang=en-US
    enabled: true
  - id: ibd
    name: Investor's Business Daily
    url: https://www.investors.com/feed/
    enabled: true
  - id: seekingalpha
    name: Seeking Alpha
    url: https://seekingalpha.com/market_currents.xml
    enabled: true
  # Reuters 는 공식 RSS 가 없어 Finnhub 뉴스 API(아래)로 받는다.
  # Barron's 는 공개 RSS 가 불안정해 기본으로 꺼 둔다.
  - id: barrons
    name: Barron's
    url: https://www.barrons.com/feed/rssheadlines
    enabled: false

# Finnhub 시장 뉴스 (키가 있을 때만). Reuters 등 여러 매체가 섞여 온다.
finnhub_news:
  enabled: true
  category: general

# 헤드라인 → 티커 매핑 보조. 회사명에서 자동으로 뽑기 어려운 별칭.
aliases:
  GOOGL: [Google, Alphabet, YouTube]
  META: [Meta Platforms, Facebook, Instagram]
  AMZN: [Amazon, AWS]
  AAPL: [Apple, iPhone]
  MSFT: [Microsoft]
  NVDA: [Nvidia, NVIDIA]
  TSLA: [Tesla]
  BRK.B: [Berkshire]
  JPM: [JPMorgan, JP Morgan]
  XOM: [Exxon]
  WMT: [Walmart]
  DIS: [Disney]
  BA: [Boeing]
  INTC: [Intel]
  NFLX: [Netflix]
